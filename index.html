<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rubik's Cube Starter</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 20px; }
    button { margin: 5px; padding: 10px 15px; font-size: 16px; }
    #cube-container { margin-top: 20px; }
  </style>
</head>
<body>

<h1>Rubik's Cube Starter</h1>

<button id="scrambleBtn">Scramble Cube</button>
<button id="solveBtn">Solve Cube (Demo)</button>

<div id="cube-container"></div>

<script>
// === Rubik's Cube Class ===
class RubiksCube {
  constructor() {
    this.cube = {
      U: Array(9).fill('w'), // Up - white
      D: Array(9).fill('y'), // Down - yellow
      F: Array(9).fill('g'), // Front - green
      B: Array(9).fill('b'), // Back - blue
      L: Array(9).fill('o'), // Left - orange
      R: Array(9).fill('r')  // Right - red
    };
    this.steps = []; // To store rotations
  }

  // Clockwise rotation of a face (simple, edges not fully implemented for demo)
  rotateFaceClockwise(face) {
    let f = this.cube[face];
    this.cube[face] = [f[6], f[3], f[0], f[7], f[4], f[1], f[8], f[5], f[2]];
    this.steps.push(`Rotate ${face} clockwise`);
  }

  // Anti-clockwise rotation (just reverse of clockwise)
  rotateFaceAntiClockwise(face) {
    let f = this.cube[face];
    this.cube[face] = [f[2], f[5], f[8], f[1], f[4], f[7], f[0], f[3], f[6]];
    this.steps.push(`Rotate ${face} anti-clockwise`);
  }

  // Scramble cube with random rotations
  scramble(steps = 10) {
    const faces = ['U','D','F','B','L','R'];
    for (let i = 0; i < steps; i++) {
      const face = faces[Math.floor(Math.random() * faces.length)];
      const clockwise = Math.random() > 0.5;
      clockwise ? this.rotateFaceClockwise(face) : this.rotateFaceAntiClockwise(face);
    }
  }

  // Display cube using getCubeSvg()
  displayCube() {
    const colors = Object.values(this.cube).flat().join('');
    // getCubeSvg(colors) is assumed to return HTML/SVG for cube
    document.getElementById('cube-container').innerHTML = getCubeSvg(colors);
  }

  // Placeholder solve function
  solveDemo() {
    // For demo, just rotate U clockwise twice
    this.rotateFaceClockwise('U');
    this.rotateFaceClockwise('U');
    alert('Demo solve executed. Steps:\n' + this.steps.join('\n'));
    this.displayCube();
  }
}

// === Demo getCubeSvg function ===
function getCubeSvg(colorString) {
  // Simple visual: 6 faces displayed as colored 3x3 grids
  let faces = ['U','D','F','B','L','R'];
  let html = '';
  for (let i = 0; i < faces.length; i++) {
    html += `<h3>${faces[i]} face</h3><div style="display:grid;grid-template-columns:repeat(3,40px);gap:2px;margin:5px auto;width: max-content;">`;
    for (let j = 0; j < 9; j++) {
      html += `<div style="width:40px;height:40px;background:${colorString[i*9+j]};border:1px solid #333;"></div>`;
    }
    html += `</div>`;
  }
  return html;
}

// === Initialize Cube ===
const cube = new RubiksCube();
cube.displayCube();

// === Button Handlers ===
document.getElementById('scrambleBtn').addEventListener('click', () => {
  cube.scramble(15);
  cube.displayCube();
});

document.getElementById('solveBtn').addEventListener('click', () => {
  cube.solveDemo();
});

</script>

</body>
</html>
